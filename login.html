<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acesso | Gestão Menezes</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 8%,#3b1220 0,transparent 45%),#090709;color:#f9f2ec;font-family:Inter,system-ui,-apple-system,Arial,sans-serif;display:grid;place-items:center;padding:24px}.panel{width:min(100%,440px);border:1px solid #a57b465c;border-radius:22px;background:linear-gradient(145deg,#190e13,#090809);padding:38px;box-shadow:0 22px 70px #0009}.kicker{color:#d2ac6a;letter-spacing:.22em;font-size:11px;text-transform:uppercase;font-weight:800}.title{font-size:32px;margin:14px 0 5px;font-weight:900}.subtitle{color:#b8aeb2;font-size:14px;line-height:1.5;margin:0 0 29px}.field{margin-top:18px}label{display:block;font-size:12px;font-weight:700;color:#cfbdc3;margin-bottom:9px}select,input{width:100%;padding:15px 16px;border:1px solid #6c4d51;background:#170e12;border-radius:11px;color:white;font:inherit;outline:none}select:focus,input:focus{border-color:#dab17b;box-shadow:0 0 0 3px #dab17b22}button{margin-top:27px;width:100%;padding:15px;border:none;border-radius:11px;color:#21140c;background:linear-gradient(120deg,#ad814b,#f0d29a);font-size:14px;font-weight:900;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{color:#ffb3bd;min-height:22px;font-size:13px;margin-top:12px}.foot{color:#84787c;text-align:center;font-size:11px;margin-top:20px}
</style></head><body><main class="panel"><div class="kicker">Dashboard • Ademicon</div><h1 class="title">Gestão Menezes</h1><p class="subtitle">Acesso restrito. Selecione seu perfil e insira sua senha para entrar na plataforma.</p><form id="form"><div class="field"><label for="role">Tipo de acesso</label><select id="role" required><option value="consultor">Consultor • Visualização</option><option value="trainee">Trainee • Cadastrar vendas</option><option value="gestor">Gestor • Acesso total</option></select></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required placeholder="Digite sua senha"></div><button id="submit" type="submit">Entrar no dashboard</button><div id="message" class="message" aria-live="polite"></div></form><div class="foot">Gestão Menezes • Plataforma Comercial</div></main><script>
fetch('/api/auth',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(d.role)location.replace('/')}).catch(()=>{});
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),m=document.getElementById('message');m.textContent='';b.disabled=true;try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({role:document.getElementById('role').value,password:document.getElementById('password').value})});if(!r.ok){m.textContent=r.status===401?'Perfil ou senha incorretos.':'Não foi possível entrar. Tente novamente.';return}location.replace('/')}catch{m.textContent='Não foi possível conectar ao servidor.'}finally{b.disabled=false}});
</script></body></html>
