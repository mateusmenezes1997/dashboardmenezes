name: Integrar Performance Live na branch de acessos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrar-performance-acessos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acessos-gestao-menezes
          persist-credentials: true
      - name: Integrar painel diretamente
        run: |
          node <<'NODE'
          const fs=require('fs');
          let html=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const start=sw.indexOf('<style id="gm-live-performance-v2">');
          const end=sw.indexOf('<\\/script>',start);
          if(start<0||end<0)throw Error('Template nao encontrado no service worker');
          const panel=sw.slice(start,end).replace(/<\\\/script>/g,'</script>')+'</script>';
          if(!html.includes('gm-live-performance-v2'))html=html.replace(/<\/body>/i,panel+'\n</body>');
          if(!html.includes('/performance-live.js'))html=html.replace(/<\/body>/i,'<script defer src="/performance-live.js?v=5"></script>\n</body>');
          if(!html.includes('gm-live-performance-v2')||!html.includes('/performance-live.js'))throw Error('HTML final sem painel');
          fs.writeFileSync('index.html',html);
          console.log('Arquivo HTML final atualizado:',html.length);
          NODE
      - name: Validar HTML e JavaScript do telao
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('performance-live.js','utf8');
          const ids=['gmLivePerformance','gmTicker','gmPodium','gmBars','gmKpis','gmLeaders'];
          const found=Object.fromEntries(ids.map(id=>[id,html.includes('id="'+id+'"')]));
          if(Object.values(found).some(x=>!x))throw new Error('Faltam elementos do painel: '+JSON.stringify(found));
          if(!html.includes('src="/performance-live.js'))throw new Error('Script do telao nao incluido na pagina');
          new vm.Script(js,{filename:'performance-live.js'});
          const match=html.match(/<script id="gm-live-performance-runtime-v2">([\s\S]*?)<\/script>/i);
          if(!match)throw new Error('Runtime principal do painel nao encontrado');
          new vm.Script(match[1],{filename:'inline-performance.js'});
          const report={html_has_panel:true,html_has_launch_script:true,inline_runtime_syntax_ok:true,external_runtime_syntax_ok:true,ids:found,checks:{state_const:(html.match(/\\bconst\\s+state\\s*=/g)||[]).length,state_let:(html.match(/\\blet\\s+state\\s*=/g)||[]).length,state_var:(html.match(/\\bvar\\s+state\\s*=/g)||[]).length,window_state:(html.match(/window\\.state/g)||[]).length,month_openings:(html.match(/monthOpenings/g)||[]).length,fetch_calls:(html.match(/\\bfetch\\s*\\(/g)||[]).length},generated_at:new Date().toISOString()};
          fs.writeFileSync('live-check.json',JSON.stringify(report,null,2)+'\n');
          console.log('PAINEL OK',JSON.stringify(report));
          NODE
      - name: Commit
        run: |
          git config user.name "Gestao Menezes Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html live-check.json
          if git diff --cached --quiet; then echo "Sem mudancas"; exit 0; fi
          git commit -m "Incorpora painel em tela cheia e ranking animado no HTML"
          git push origin HEAD:acessos-gestao-menezes
