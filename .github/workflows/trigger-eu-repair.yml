name: Trigger EU sales reconciliation

on:
  push:
    branches:
      - cloudflare-migracao
    paths:
      - '.github/workflows/trigger-eu-repair.yml'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reconciliation and print status
        run: |
          set -e
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            https://dashboardmenezes.mateusademicon7.workers.dev/api/health | tee /tmp/health.json
          echo
          python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          print("personalImport=", data.get("personalImport"))
          print("personalRepair=", data.get("personalRepair"))
          if not data.get("ok"):
              raise SystemExit("Health endpoint did not return ok=true")
          if not data.get("personalRepair"):
              raise SystemExit("Repair status not available yet")
          PY
